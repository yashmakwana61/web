name: Deploy Website to Hostinger

on:
  push:
    branches:
      - main  # Make sure this matches your main branch name

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your required node version

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        # We only build the web app
        run: npm run build --workspace=web
        env:
          # Add any necessary API keys or SANITY environment variables here
          NEXT_PUBLIC_SANITY_PROJECT_ID: your_project_id 

      - name: Sync files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # This assumes you set output: 'export' and Next generates an 'out' folder
          local-dir: ./apps/web/out/ 
          # Hostinger's default public folder is public_html
          server-dir: ./public_html/
